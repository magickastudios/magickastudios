<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magicka Studios</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --text-color: #ffffff;
            --accent-color: #8a2be2; /* Magicka Purple */
            --input-bg: #1f1f2e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1, h2 { color: var(--accent-color); }
        .social-links a {
            display: inline-block;
            margin-right: 15px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
        }
        .social-links a:hover { opacity: 0.8; }
        form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
        }
        label { margin-bottom: 5px; font-weight: bold; }
        input, textarea {
            background: var(--input-bg);
            border: 1px solid #333;
            color: white;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>Magicka Studios</h1>
    <p>Welcome to our official hub. We create immersive digital experiences.</p>

    <!-- Socials Section -->
    <h2>Connect With Us</h2>
    <div class="social-links">
        <a href="https://x.com" target="_blank">X (Twitter)</a>
        <!-- Uncomment these as you create them:
        <a href="https://youtube.com" target="_blank">YouTube</a>
        <a href="https://tiktok.com" target="_blank">TikTok</a> 
        -->
    </div>

    <!-- Contact Form Section -->
    <h2>Contact Us</h2>
    <!-- We use web3forms to hide your actual email address -->
    <form action="https://api.web3forms.com/submit" method="POST">
        
        <!-- FIXME: Replace YOUR_ACCESS_KEY_HERE with a key from web3forms.com -->
        <input type="hidden" name="access_key" value="b9e6bb3f-4b13-42f0-b4c2-4e007cef1688">
        
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required placeholder="Your Name">

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required placeholder="your@email.com">

        <label for="message">Message</label>
        <textarea name="message" id="message" rows="5" required placeholder="What's on your mind?"></textarea>

        <button type="submit">Send Message</button>
    </form>

<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="b9e6bb3f-4b13-42f0-b4c2-4e007cef1688">
  <input type="text" name="name" required>
  <input type="email" name="email" required>
  <textarea name="message" required></textarea>
  <button type="submit">Submit</button>
</form>

</body>
</html>
