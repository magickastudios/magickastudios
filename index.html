<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Brand Name | Audio Assets</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #16161a;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --fab-accent: #00e5ff;
            --unity-accent: #c4b5fd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
            text-align: center;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            background: #27272a;
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 2rem 0;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            border: 1px solid #27272a;
            color: var(--text-main);
            padding: 1rem;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .store-btn:hover {
            transform: translateY(-2px);
            border-color: #3f3f46;
        }

        .store-btn.fab { border-left: 4px solid var(--fab-accent); }
        .store-btn.unity { border-left: 4px solid var(--unity-accent); }

        .audio-preview {
            background: var(--card-bg);
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 1rem;
        }

        .audio-preview h3 {
            font-size: 0.9rem;
            margin: 0 0 0.75rem 0;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        audio {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Logo / Avatar Placeholder -->
        <div class="profile-img">🎹</div>

        <h1>Your Brand Name</h1>
        <p class="bio">Premium music packages & sound design toolkits for indie game developers.</p>

        <!-- Store Redirect Buttons -->
        <div class="links-container">
            <a href="https://fab.com" target="_blank" class="store-btn fab">Shop Music on Fab</a>
            <a href="https://unity.com" target="_blank" class="store-btn unity">Shop Tracks on Unity Store</a>
        </div>

        <!-- HTML5 Native Audio Player -->
        <div class="audio-preview">
            <h3>Showcase Reel</h3>
            <audio controls src="showcase.mp3">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

</body>
</html>
